name: roluna_connect
description: "Central de Comunicação Interna – Roluna Rolamentos"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend / Auth / DB
  supabase_flutter: ^2.5.6

  # Navegação
  go_router: ^14.2.0

  # Estado
  flutter_riverpod: ^2.5.1

  # UI / UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utilitários
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
